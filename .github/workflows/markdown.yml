name: Lint Markdown

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.yaml"
      - ".github/workflows/markdown.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint.yaml"
      - ".github/workflows/markdown.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same pinned command AGENTS.md gives for local runs, so a new
      # markdownlint release cannot fail CI on files that pass locally.
      # Rules come from .markdownlint.yaml.
      - run: npx --yes markdownlint-cli2@0.23.3 "**/*.md" "#.venv" "#site"
