name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "learning/**"
      - "properdocs.yml"
      - "hooks.py"
      - "pyproject.toml"
      - ".agents/tools/check-mermaid.mjs"
      - ".agents/tools/package.json"
      - ".agents/tools/package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install .
      - run: properdocs build --strict
      # The source check in mermaid.yml cannot see a diagram the build mangles.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix .agents/tools
      - run: node .agents/tools/check-mermaid.mjs --site site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
