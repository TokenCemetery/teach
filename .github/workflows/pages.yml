name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # mkdocs-shadcn from our fork's `main`: includes sidebar fixes not yet
      # released upstream (asiffer/mkdocs-shadcn#107). Switch back to the
      # PyPI package once that PR is merged and released.
      - run: pip install mkdocs "mkdocs-shadcn @ git+https://github.com/olegshulyakov/mkdocs-shadcn@main" mkdocs-static-i18n mkdocs-awesome-nav pymdown-extensions Pygments
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
