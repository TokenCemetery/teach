name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-revision-date-localized reads each page's last commit. The
          # default shallow clone has no such log, so every page would fall
          # back to the build date.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The theme is pinned: its layout, sidebar width and navigation change
      # between releases, and this site is checked against one of them.
      - run: pip install mkdocs mkdocs-primer==0.3.1 mkdocs-static-i18n mkdocs-awesome-nav mkdocs-section-index mkdocs-git-revision-date-localized-plugin mkdocs-mermaid2-plugin pymdown-extensions Pygments
      # Same command AGENTS.md requires locally, so CI cannot pass on a build
      # that would fail there.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
