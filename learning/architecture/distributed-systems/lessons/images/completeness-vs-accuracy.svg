<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Completeness and accuracy trade off against each other; real failure detectors settle for eventual accuracy</title>
  <desc id="desc">A plot with accuracy on the horizontal axis and completeness on the vertical axis. The top-left region, high completeness and low accuracy, is a detector that suspects everyone constantly, catching every real failure but crying wolf. The bottom-right region, high accuracy and low completeness, is a detector that never suspects anyone, never crying wolf but missing real failures. The top-right corner, both high, is the impossible perfect detector. A marked point sits near the top-right but short of the corner, labeled real failure detectors: eventually accurate, where practical systems actually live.</desc>

  <line x1="80" y1="190" x2="400" y2="190" stroke="#7a828c" stroke-width="1.5"/>
  <line x1="80" y1="190" x2="80" y2="20" stroke="#7a828c" stroke-width="1.5"/>
  <text x="400" y="205" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">accuracy -&gt;</text>
  <text x="75" y="20" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">completeness</text>
  <text x="75" y="30" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">^</text>

  <line x1="240" y1="20" x2="240" y2="190" stroke="#7a828c" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="105" x2="400" y2="105" stroke="#7a828c" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3,3"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#7a828c">
    <text x="90" y="45" text-anchor="start">suspects everyone constantly:</text>
    <text x="90" y="56" text-anchor="start">complete, but cries wolf</text>
    <text x="90" y="67" text-anchor="start">(low accuracy)</text>

    <text x="255" y="175" text-anchor="start">never suspects anyone:</text>
    <text x="255" y="186" text-anchor="start">accurate, but misses real</text>
    <text x="255" y="197" text-anchor="start">failures (low completeness)</text>
  </g>

  <circle cx="340" cy="45" r="4" fill="#bf7d1a"/>
  <text x="340" y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#bf7d1a">real failure detectors:</text>
  <text x="340" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#bf7d1a">eventually accurate</text>

  <text x="398" y="30" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">(perfect + complete: impossible)</text>
</svg>
