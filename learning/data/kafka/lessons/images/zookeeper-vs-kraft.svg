<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">ZooKeeper mode compared with KRaft mode</title>
  <desc id="desc">Two architecture diagrams side by side. On the left, ZooKeeper mode: an external ZooKeeper ensemble outside the Kafka cluster elects a controller via an ephemeral znode, and on failover the new controller re-reads the full cluster state from ZooKeeper before it can push that full state out to every broker. On the right, KRaft mode: a controller quorum inside the cluster itself replicates a metadata log using the Raft protocol, with one controller active and the others continuously replaying that log as standby, so a new active controller is already caught up and does not need a full state re-fetch on failover.</desc>

  <text x="190" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a828c">ZooKeeper mode</text>
  <text x="570" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#bf7d1a">KRaft mode</text>

  <rect x="20" y="45" width="340" height="60" rx="6" fill="none" stroke="#7a828c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="190" y="68" text-anchor="middle" font-size="12" fill="#7a828c">ZooKeeper ensemble</text>
  <text x="190" y="86" text-anchor="middle" font-size="11" fill="#7a828c">(external system, own quorum)</text>

  <line x1="190" y1="105" x2="190" y2="135" stroke="#7a828c" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="200" y="122" font-size="10" fill="#7a828c">elects via</text>
  <text x="200" y="133" font-size="10" fill="#7a828c">ephemeral znode</text>

  <rect x="60" y="140" width="260" height="45" rx="6" fill="none" stroke="#7a828c" stroke-width="1.5"/>
  <text x="190" y="167" text-anchor="middle" font-size="12" fill="#7a828c">controller (one broker)</text>

  <line x1="190" y1="185" x2="190" y2="215" stroke="#7a828c" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="290" y="203" font-size="10" fill="#7a828c" text-anchor="middle">on failover: re-read full</text>
  <text x="290" y="214" font-size="10" fill="#7a828c" text-anchor="middle">state from ZooKeeper first</text>

  <rect x="40" y="220" width="90" height="40" rx="5" fill="none" stroke="#7a828c" stroke-width="1.5"/>
  <text x="85" y="245" text-anchor="middle" font-size="11" fill="#7a828c">broker</text>
  <rect x="150" y="220" width="90" height="40" rx="5" fill="none" stroke="#7a828c" stroke-width="1.5"/>
  <text x="195" y="245" text-anchor="middle" font-size="11" fill="#7a828c">broker</text>
  <rect x="260" y="220" width="90" height="40" rx="5" fill="none" stroke="#7a828c" stroke-width="1.5"/>
  <text x="305" y="245" text-anchor="middle" font-size="11" fill="#7a828c">broker</text>

  <line x1="190" y1="185" x2="85" y2="220" stroke="#7a828c" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="190" y1="185" x2="195" y2="220" stroke="#7a828c" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="190" y1="185" x2="305" y2="220" stroke="#7a828c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="190" y="280" text-anchor="middle" font-size="10" fill="#7a828c">full-state push to every broker</text>

  <rect x="400" y="45" width="340" height="60" rx="6" fill="none" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="570" y="68" text-anchor="middle" font-size="12" fill="#bf7d1a">controller quorum (inside the cluster)</text>
  <text x="570" y="86" text-anchor="middle" font-size="11" fill="#bf7d1a">metadata log, replicated via Raft</text>

  <rect x="410" y="115" width="100" height="45" rx="5" fill="none" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="460" y="137" text-anchor="middle" font-size="11" fill="#bf7d1a">active</text>
  <text x="460" y="150" text-anchor="middle" font-size="10" fill="#bf7d1a">(leader)</text>

  <rect x="520" y="115" width="100" height="45" rx="5" fill="none" stroke="#bf7d1a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="570" y="137" text-anchor="middle" font-size="11" fill="#bf7d1a">standby</text>
  <text x="570" y="150" text-anchor="middle" font-size="10" fill="#bf7d1a">(replaying log)</text>

  <rect x="630" y="115" width="100" height="45" rx="5" fill="none" stroke="#bf7d1a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="680" y="137" text-anchor="middle" font-size="11" fill="#bf7d1a">standby</text>
  <text x="680" y="150" text-anchor="middle" font-size="10" fill="#bf7d1a">(replaying log)</text>

  <line x1="510" y1="137" x2="520" y2="137" stroke="#bf7d1a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="510" y1="137" x2="630" y2="137" stroke="#bf7d1a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="570" y="105" text-anchor="middle" font-size="10" fill="#bf7d1a">log entries stream continuously</text>

  <line x1="570" y1="160" x2="570" y2="215" stroke="#bf7d1a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="670" y="195" font-size="10" fill="#bf7d1a" text-anchor="middle">on failover: standby is</text>
  <text x="670" y="206" font-size="10" fill="#bf7d1a" text-anchor="middle">already caught up</text>

  <rect x="420" y="220" width="90" height="40" rx="5" fill="none" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="465" y="245" text-anchor="middle" font-size="11" fill="#bf7d1a">broker</text>
  <rect x="530" y="220" width="90" height="40" rx="5" fill="none" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="575" y="245" text-anchor="middle" font-size="11" fill="#bf7d1a">broker</text>
  <rect x="640" y="220" width="90" height="40" rx="5" fill="none" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="685" y="245" text-anchor="middle" font-size="11" fill="#bf7d1a">broker</text>

  <line x1="570" y1="215" x2="465" y2="220" stroke="#bf7d1a" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="570" y1="215" x2="575" y2="220" stroke="#bf7d1a" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="570" y1="215" x2="685" y2="220" stroke="#bf7d1a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="570" y="280" text-anchor="middle" font-size="10" fill="#bf7d1a">incremental updates only</text>

  <text x="380" y="340" text-anchor="middle" font-size="11" fill="#7a828c">Combined mode: a node can hold</text>
  <text x="380" y="356" text-anchor="middle" font-size="11" fill="#7a828c">process.roles=broker,controller at once</text>

  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a828c"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#bf7d1a"/>
    </marker>
  </defs>
</svg>
