<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180" role="img" aria-labelledby="title desc">
  <title id="title">A superseded row version stays in storage as a dead tuple until vacuum reclaims it, because an older transaction may still need it</title>
  <desc id="desc">A timeline showing a row's two versions. v1 is created at xmin 100 and is the current, visible version until an UPDATE at time 105 marks it superseded (xmax 105) and creates v2, the new current version. v1 does not disappear at that point: it remains in storage as a dead tuple, shown hatched, because transaction T1 started before the update and its snapshot may still be entitled to see v1. Only when vacuum runs later does v1's space actually get reclaimed. v2 is visible and current from the update onward.</desc>

  <line x1="60" y1="100" x2="440" y2="100" stroke="#7a828c" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#7a828c">
    <text x="100" y="112" text-anchor="middle">xmin=100</text>
    <text x="220" y="112" text-anchor="middle">UPDATE: xmax=105</text>
    <text x="400" y="112" text-anchor="middle">vacuum runs</text>
  </g>
  <g stroke="#7a828c" stroke-width="1" stroke-dasharray="2,2">
    <line x1="100" y1="20" x2="100" y2="160"/>
    <line x1="220" y1="20" x2="220" y2="160"/>
    <line x1="400" y1="20" x2="400" y2="160"/>
  </g>

  <rect x="100" y="120" width="120" height="18" fill="#bf7d1a" fill-opacity="0.3" stroke="#bf7d1a" stroke-width="1.5"/>
  <rect x="220" y="120" width="180" height="18" fill="#7a828c" fill-opacity="0.15" stroke="#7a828c" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="220" y="132" text-anchor="start" dx="4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">v1: dead tuple, not yet reclaimed</text>

  <rect x="220" y="145" width="220" height="18" fill="#bf7d1a" fill-opacity="0.3" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="330" y="157" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">v2: current version</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">
    <text x="110" y="132" text-anchor="start" dx="0">v1</text>
  </g>

  <line x1="160" y1="30" x2="300" y2="30" stroke="#bf7d1a" stroke-width="1.5"/>
  <line x1="160" y1="26" x2="160" y2="34" stroke="#bf7d1a" stroke-width="1.5"/>
  <line x1="300" y1="26" x2="300" y2="34" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="230" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">T1: started before the update, snapshot still needs v1</text>
  <line x1="230" y1="34" x2="260" y2="118" stroke="#bf7d1a" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
