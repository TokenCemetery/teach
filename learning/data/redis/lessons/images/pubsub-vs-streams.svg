<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180" role="img" aria-labelledby="title desc">
  <title id="title">Pub/Sub delivers only to subscribers connected right now, with nothing kept afterward; a stream is a persisted, replayable log</title>
  <desc id="desc">Two panels. On the left, pub/sub: a publisher sends a message that reaches only the two subscribers currently connected; a third subscriber that connects a moment later never sees it, since nothing was kept. On the right, a stream: entries are appended to a persisted log with their own IDs; a consumer group tracks each consumer's last-delivered ID and a pending entries list of unacknowledged messages, so a late-joining or crashed consumer can still read from where it left off or have its pending entries reclaimed by another consumer.</desc>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">
    <text x="115" y="14" text-anchor="middle">pub/sub: fire-and-forget, nothing kept</text>
    <text x="365" y="14" text-anchor="middle">stream: persisted, replayable log</text>
  </g>

  <rect x="60" y="28" width="110" height="20" fill="#7a828c" fill-opacity="0.25" stroke="#7a828c" stroke-width="1.5"/>
  <text x="115" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#7a828c">PUBLISH "event"</text>

  <g stroke="#bf7d1a" stroke-width="1.5">
    <line x1="90" y1="48" x2="60" y2="70"/>
    <line x1="140" y1="48" x2="140" y2="70"/>
  </g>
  <rect x="30" y="70" width="60" height="20" fill="#bf7d1a" fill-opacity="0.25" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="60" y="84" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">sub A</text>
  <rect x="110" y="70" width="60" height="20" fill="#bf7d1a" fill-opacity="0.25" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="140" y="84" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">sub B</text>

  <rect x="190" y="70" width="70" height="20" fill="none" stroke="#7a828c" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="225" y="84" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="6.5" fill="#7a828c">sub C (joins late)</text>
  <text x="225" y="105" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="6.5" fill="#7a828c">never sees it</text>

  <g stroke="#7a828c" stroke-width="1.5" fill="none">
    <rect x="290" y="28" width="40" height="20"/>
    <rect x="330" y="28" width="40" height="20"/>
    <rect x="370" y="28" width="40" height="20"/>
    <rect x="410" y="28" width="40" height="20"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="6.5" fill="#7a828c">
    <text x="310" y="41" text-anchor="middle">1-1</text>
    <text x="350" y="41" text-anchor="middle">1-2</text>
    <text x="390" y="41" text-anchor="middle">1-3</text>
    <text x="430" y="41" text-anchor="middle">1-4</text>
  </g>

  <text x="350" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">consumer group: last-delivered ID + pending entries list</text>

  <rect x="290" y="75" width="65" height="20" fill="#bf7d1a" fill-opacity="0.25" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="322" y="89" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="6.5" fill="#bf7d1a">consumer 1</text>
  <rect x="365" y="75" width="65" height="20" fill="#bf7d1a" fill-opacity="0.25" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="397" y="89" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="6.5" fill="#bf7d1a">consumer 2</text>
  <text x="360" y="108" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="6.5" fill="#bf7d1a">unacked entries reclaimable via XCLAIM</text>
</svg>
