<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 268" width="500" height="268" role="img" aria-labelledby="title desc">
  <title id="title">Four records for one key, at 12, 16, 19 and 27 seconds, grouped by tumbling, hopping, sliding and session windows</title>
  <desc id="desc">A time axis from 5 to 35 seconds with records at 12, 16, 19 and 27, and a later out-of-order record at 23. Tumbling windows of 10 seconds: 10 to 20 holds 3 records, 20 to 30 holds 1. Hopping windows of 10 seconds advancing by 5: 5 to 15 holds 1, 10 to 20 holds 3, 15 to 25 holds 2, 20 to 30 holds 1, 25 to 35 holds 1. Sliding windows with a 5 second time difference: 7 to 12 holds 1, 11 to 16 holds 2, just after 12 to just after 17 holds 1, 14 to 19 holds 2, just after 16 to just after 21 holds 1, 22 to 27 holds 1. Session windows with a 5 second inactivity gap: 12 to 19 holds 3 and 27 to 27 holds 1; once the record at 23 arrives they merge into one session from 12 to 27 holding 5.</desc>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#7a828c">
    <text x="250" y="12" text-anchor="middle">one key, counts per window, time in seconds</text>
    <text x="4" y="77">tumbling</text>
    <text x="4" y="87">size 10</text>
    <text x="4" y="112">hopping</text>
    <text x="4" y="122">size 10</text>
    <text x="4" y="132">hop 5</text>
    <text x="4" y="166">sliding</text>
    <text x="4" y="176">diff 5</text>
    <text x="4" y="219">session</text>
    <text x="4" y="229">gap 5</text>
  </g>

  <line x1="60" y1="44" x2="480" y2="44" stroke="#7a828c" stroke-width="1"/>
  <g stroke="#7a828c" stroke-width="1">
    <line x1="60" y1="41" x2="60" y2="47"/>
    <line x1="130" y1="41" x2="130" y2="47"/>
    <line x1="200" y1="41" x2="200" y2="47"/>
    <line x1="270" y1="41" x2="270" y2="47"/>
    <line x1="340" y1="41" x2="340" y2="47"/>
    <line x1="410" y1="41" x2="410" y2="47"/>
    <line x1="480" y1="41" x2="480" y2="47"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#7a828c" text-anchor="middle">
    <text x="60" y="57">5</text>
    <text x="130" y="57">10</text>
    <text x="200" y="57">15</text>
    <text x="270" y="57">20</text>
    <text x="340" y="57">25</text>
    <text x="410" y="57">30</text>
    <text x="480" y="57">35</text>
  </g>
  <g fill="#bf7d1a">
    <circle cx="158" cy="44" r="3.5"/>
    <circle cx="214" cy="44" r="3.5"/>
    <circle cx="256" cy="44" r="3.5"/>
    <circle cx="368" cy="44" r="3.5"/>
  </g>
  <circle cx="312" cy="44" r="3.5" fill="none" stroke="#7a828c" stroke-width="1.2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" text-anchor="middle">
    <text x="158" y="35" fill="#bf7d1a">12</text>
    <text x="214" y="35" fill="#bf7d1a">16</text>
    <text x="256" y="35" fill="#bf7d1a">19</text>
    <text x="368" y="35" fill="#bf7d1a">27</text>
    <text x="312" y="27" fill="#7a828c">23, arrives late</text>
    <text x="312" y="36" fill="#7a828c">(session row only)</text>
  </g>

  <g fill="#bf7d1a" fill-opacity="0.3" stroke="#bf7d1a" stroke-width="1.2">
    <rect x="131" y="70" width="138" height="16"/>
    <rect x="271" y="70" width="138" height="16"/>

    <rect x="61" y="102" width="138" height="13"/>
    <rect x="201" y="102" width="138" height="13"/>
    <rect x="341" y="102" width="138" height="13"/>
    <rect x="131" y="119" width="138" height="13"/>
    <rect x="271" y="119" width="138" height="13"/>

    <rect x="88" y="148" width="70" height="13"/>
    <rect x="186" y="148" width="70" height="13"/>
    <rect x="312" y="148" width="56" height="13"/>
    <rect x="144" y="165" width="69" height="13"/>
    <rect x="215" y="165" width="69" height="13"/>
    <rect x="159" y="182" width="69" height="13"/>

    <rect x="158" y="210" width="98" height="14"/>
    <rect x="364" y="210" width="8" height="14"/>
  </g>
  <rect x="158" y="230" width="210" height="14" fill="none" stroke="#bf7d1a" stroke-width="1.2" stroke-dasharray="4 3"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#bf7d1a" text-anchor="middle">
    <text x="200" y="81">3</text>
    <text x="340" y="81">1</text>

    <text x="130" y="112">1</text>
    <text x="270" y="112">2</text>
    <text x="410" y="112">1</text>
    <text x="200" y="129">3</text>
    <text x="340" y="129">1</text>

    <text x="123" y="158">1</text>
    <text x="221" y="158">2</text>
    <text x="340" y="158">1</text>
    <text x="178" y="175">2</text>
    <text x="249" y="175">1</text>
    <text x="193" y="192">1</text>

    <text x="207" y="220">3</text>
    <text x="384" y="220">1</text>
    <text x="263" y="240">5 after the merge</text>
  </g>

  <text x="250" y="262" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#7a828c">tumbling and hopping: start inclusive, end exclusive; sliding: both ends inclusive</text>
</svg>
