<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 258" width="560" height="258" role="img" aria-labelledby="title desc">
  <title id="title">LoRA moves length and angle together; DoRA separates them</title>
  <desc id="desc">One column of a weight matrix drawn as a vector from an origin, with a dotted quarter circle marking unit norm. On the left, adding the low-rank term BA lands on a vector whose angle and length have both changed. On the right, only the angle survives: renormalising puts the direction on the unit circle, and the trainable magnitude m then sets the length, here back to the length W0 started with.</desc>

  <!-- Lengths and angles are computed, not eyeballed. The accent vector shares
       its angle with W0 + BA and its length with W0, which is the decoupling
       stated in the text. Tones validated for both surfaces; see .agents/TODO.md. -->

  <defs>
    <marker id="g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7a828c"/></marker>
    <marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#bf7d1a"/></marker>
  </defs>

  <path d="M280,26 V232" stroke="#7a828c" stroke-width="1" stroke-opacity="0.25" fill="none"/>
  <text x="20.0" y="36.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">LoRA</text>
  <text x="300.0" y="36.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">DoRA</text>

  <path d="M154.8,184.1 L154.4,179.6 L153.7,175.2 L152.8,170.9 L151.7,166.6 L150.4,162.3 L148.8,158.2 L147.0,154.1 L145.1,150.1 L142.9,146.2 L140.5,142.5 L137.9,138.8 L135.1,135.4 L132.2,132.0 L129.0,128.9 L125.8,125.8 L122.3,123.0 L118.8,120.4 L115.0,117.9 L111.2,115.7 L107.3,113.6 L103.2,111.8 L99.1,110.1 L94.9,108.7 L90.6,107.5 L86.2,106.6 L81.8,105.8 L77.4,105.3" stroke="#7a828c" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 3" fill="none"/>
  <path d="M434.8,184.1 L434.4,179.6 L433.7,175.2 L432.8,170.9 L431.7,166.6 L430.4,162.3 L428.8,158.2 L427.0,154.1 L425.1,150.1 L422.9,146.2 L420.5,142.5 L417.9,138.8 L415.1,135.4 L412.2,132.0 L409.0,128.9 L405.8,125.8 L402.3,123.0 L398.8,120.4 L395.0,117.9 L391.2,115.7 L387.3,113.6 L383.2,111.8 L379.1,110.1 L374.9,108.7 L370.6,107.5 L366.2,106.6 L361.8,105.8 L357.4,105.3" stroke="#7a828c" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 3" fill="none"/>
  <text x="163.3" y="178.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" opacity="0.85">unit norm</text>
  <text x="443.3" y="178.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" opacity="0.85">unit norm</text>

  <path d="M70.0,190.0 L90.5,133.6" stroke="#7a828c" stroke-width="1.5" stroke-opacity="0.7" fill="none" marker-end="url(#g)"/>
  <path d="M70.0,190.0 L156.6,140.0" stroke="#7a828c" stroke-width="1.5" stroke-opacity="0.7" fill="none" marker-end="url(#g)"/>
  <path d="M90.5,133.6 L156.6,140.0" stroke="#7a828c" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="3 2" fill="none"/>
  <text x="91.9" y="122.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" text-anchor="middle">W0</text>
  <text x="165.3" y="135.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">W0 + BA</text>
  <text x="127.4" y="124.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" opacity="0.85">BA</text>

  <path d="M350.0,190.0 L370.5,133.6" stroke="#7a828c" stroke-width="1.5" stroke-opacity="0.4" fill="none" marker-end="url(#g)"/>
  <path d="M405.4,158.0 L434.0,141.5" stroke="#7a828c" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 2" fill="none"/>
  <path d="M350.0,190.0 L402.0,160.0" stroke="#bf7d1a" stroke-width="1.5" stroke-opacity="1" fill="none" marker-end="url(#a)"/>
  <circle cx="423.6" cy="147.5" r="2.5" fill="#bf7d1a"/>
  <text x="371.9" y="122.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" text-anchor="middle" opacity="0.7">W0</text>
  <text x="440.8" y="145.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">the angle BA chose</text>
  <text x="374.0" y="189.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">m sets this length</text>

  <text x="20.0" y="234.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">one term moved the length and the angle at once</text>
  <text x="300.0" y="234.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">the angle came from BA, the length from m</text>
  <text x="20.0" y="252.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" opacity="0.85">renormalising throws away whatever length BA added, and m puts a length back</text>
</svg>
