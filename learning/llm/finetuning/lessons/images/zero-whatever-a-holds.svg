<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-labelledby="title desc">
  <title id="title">One factor is exactly zero, so the product is zero whatever the other holds</title>
  <desc id="desc">B is initialised to zero and A randomly. Every entry of the product BA is zero, so the update the adapter contributes at step zero is nothing at all and the adapted model is still the base model. If both factors were zero nothing would learn, and if both were random the product would be noise.</desc>

  <!-- The product is computed from the two grids rather than asserted, so the
       zero result is arithmetic on the page. Accent marks the consequence.
       Tones validated for both surfaces; see .agents/TODO.md. -->

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" opacity="0.85" text-anchor="middle">
    <text x="137" y="52">B</text>
    <text x="237" y="52">A</text>
    <text x="343" y="52">BA</text>
  </g>

  <g fill="#7a828c" fill-opacity="0.12">
    <rect x="110" y="60" width="26" height="16" rx="2"/>
    <rect x="138" y="60" width="26" height="16" rx="2"/>
    <rect x="110" y="78" width="26" height="16" rx="2"/>
    <rect x="138" y="78" width="26" height="16" rx="2"/>
    <rect x="110" y="96" width="26" height="16" rx="2"/>
    <rect x="138" y="96" width="26" height="16" rx="2"/>
    <rect x="196" y="69" width="26" height="16" rx="2"/>
    <rect x="224" y="69" width="26" height="16" rx="2"/>
    <rect x="252" y="69" width="26" height="16" rx="2"/>
    <rect x="196" y="87" width="26" height="16" rx="2"/>
    <rect x="224" y="87" width="26" height="16" rx="2"/>
    <rect x="252" y="87" width="26" height="16" rx="2"/>
    <rect x="302" y="60" width="26" height="16" rx="2"/>
    <rect x="330" y="60" width="26" height="16" rx="2"/>
    <rect x="358" y="60" width="26" height="16" rx="2"/>
    <rect x="302" y="78" width="26" height="16" rx="2"/>
    <rect x="330" y="78" width="26" height="16" rx="2"/>
    <rect x="358" y="78" width="26" height="16" rx="2"/>
    <rect x="302" y="96" width="26" height="16" rx="2"/>
    <rect x="330" y="96" width="26" height="16" rx="2"/>
    <rect x="358" y="96" width="26" height="16" rx="2"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="6" fill="#7a828c" text-anchor="middle">
    <text x="123" y="71">0</text>
    <text x="151" y="71">0</text>
    <text x="123" y="89">0</text>
    <text x="151" y="89">0</text>
    <text x="123" y="107">0</text>
    <text x="151" y="107">0</text>
    <text x="209" y="80">0.42</text>
    <text x="237" y="80">-0.17</text>
    <text x="265" y="80">0.63</text>
    <text x="209" y="98">-0.28</text>
    <text x="237" y="98">0.51</text>
    <text x="265" y="98">0.09</text>
    <text x="315" y="71">0</text>
    <text x="343" y="71">0</text>
    <text x="371" y="71">0</text>
    <text x="315" y="89">0</text>
    <text x="343" y="89">0</text>
    <text x="371" y="89">0</text>
    <text x="315" y="107">0</text>
    <text x="343" y="107">0</text>
    <text x="371" y="107">0</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" text-anchor="middle">
    <text x="182" y="89">x</text>
    <text x="288" y="89">=</text>
  </g>

  <text x="400" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">nothing is added at step 0</text>
  <text x="400" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">the model is still the base</text>

  <text x="20" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">the asymmetry</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" opacity="0.85">
    <text x="110" y="142">both zero: the gradient of both is zero and nothing learns</text>
    <text x="110" y="158">both random: structured noise in every targeted layer</text>
  </g>

  <text x="20" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" opacity="0.85">B is exactly zero, so the product is zero whatever A holds</text>
</svg>
