<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 235" width="520" height="235" role="img" aria-labelledby="title desc">
  <title id="title">Two sequences' block tables point at the same physical blocks until one diverges</title>
  <desc id="desc">Two block tables, sequence A on the left and sequence B on the right, each mapping four logical positions to physical block numbers. For positions 0 through 2, both tables point at the same three shared physical blocks, holding an identical prompt prefix, so that prefix's cache exists only once in memory. At position 3 the two sequences have generated different tokens, so a copy-on-write has given each one its own private block: sequence A's block 9 and sequence B's block 3, neither shared with the other.</desc>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">
    <text x="20" y="20">sequence A block table</text>
    <text x="390" y="20">sequence B block table</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5">
    <g fill="#7a828c" fill-opacity="0.12" stroke="#7a828c" stroke-opacity="0.5">
      <rect x="20" y="32" width="110" height="18" rx="2"/>
      <rect x="20" y="58" width="110" height="18" rx="2"/>
      <rect x="20" y="84" width="110" height="18" rx="2"/>
      <rect x="20" y="110" width="110" height="18" rx="2"/>
    </g>
    <g fill="#7a828c">
      <text x="30" y="44">pos 0 &#8594; blk 5</text>
      <text x="30" y="70">pos 1 &#8594; blk 2</text>
      <text x="30" y="96">pos 2 &#8594; blk 7</text>
      <text x="30" y="122">pos 3 &#8594; blk 9</text>
    </g>

    <g fill="#7a828c" fill-opacity="0.12" stroke="#7a828c" stroke-opacity="0.5">
      <rect x="390" y="32" width="110" height="18" rx="2"/>
      <rect x="390" y="58" width="110" height="18" rx="2"/>
      <rect x="390" y="84" width="110" height="18" rx="2"/>
      <rect x="390" y="110" width="110" height="18" rx="2"/>
    </g>
    <g fill="#7a828c">
      <text x="400" y="44">pos 0 &#8594; blk 5</text>
      <text x="400" y="70">pos 1 &#8594; blk 2</text>
      <text x="400" y="96">pos 2 &#8594; blk 7</text>
      <text x="400" y="122">pos 3 &#8594; blk 3</text>
    </g>
  </g>

  <g stroke="#7a828c" stroke-opacity="0.4" stroke-width="0.75">
    <line x1="130" y1="41" x2="205" y2="160"/>
    <line x1="390" y1="41" x2="245" y2="160"/>
    <line x1="130" y1="67" x2="255" y2="160"/>
    <line x1="390" y1="67" x2="295" y2="160"/>
    <line x1="130" y1="93" x2="305" y2="160"/>
    <line x1="390" y1="93" x2="345" y2="160"/>
  </g>
  <g stroke="#bf7d1a" stroke-opacity="0.6" stroke-width="0.75">
    <line x1="130" y1="119" x2="95" y2="190"/>
    <line x1="390" y1="119" x2="425" y2="190"/>
  </g>

  <g fill="#7a828c" fill-opacity="0.15" stroke="#7a828c">
    <rect x="205" y="160" width="40" height="20" rx="2"/>
    <rect x="255" y="160" width="40" height="20" rx="2"/>
    <rect x="305" y="160" width="40" height="20" rx="2"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#7a828c" text-anchor="middle">
    <text x="225" y="173">blk 5</text>
    <text x="275" y="173">blk 2</text>
    <text x="325" y="173">blk 7</text>
  </g>
  <text x="275" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#7a828c" text-anchor="middle">shared prompt prefix</text>

  <g fill="#bf7d1a" fill-opacity="0.15" stroke="#bf7d1a">
    <rect x="60" y="190" width="70" height="20" rx="2"/>
    <rect x="390" y="190" width="70" height="20" rx="2"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#bf7d1a" text-anchor="middle">
    <text x="95" y="203">blk 9 (A only)</text>
    <text x="425" y="203">blk 3 (B only)</text>
  </g>
  <text x="260" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#bf7d1a" text-anchor="middle">private after copy-on-write, once the two sequences diverge</text>
</svg>
