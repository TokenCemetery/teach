<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-labelledby="title desc">
  <title id="title">Recall@k only checks whether a hit falls inside a cutoff; MRR weighs how high it ranked</title>
  <desc id="desc">Four queries plotted along a shared rank axis from 1 to 9, at the rank of their first relevant result: 1, 3, 1, and 8. A dashed line marks the recall-at-5 cutoff. The first three queries' hits fall left of the cutoff and count toward recall at 5, while the fourth, at rank 8, falls to the right and is a miss. Each query's reciprocal rank is shown alongside it: 1.000, 0.333, 1.000, and 0.125. Recall at 5 comes out to 3 of 4, 0.75, while averaging the reciprocal ranks gives an MRR of about 0.615, pulled down by how far right that one miss's rank sits, something recall at 5 cannot see at all.</desc>

  <g stroke="#7a828c" stroke-opacity="0.3">
    <line x1="100" y1="15" x2="460" y2="15"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">
    <text x="100" y="12" text-anchor="middle">1</text>
    <text x="190" y="12" text-anchor="middle">3</text>
    <text x="280" y="12" text-anchor="middle">5</text>
    <text x="370" y="12" text-anchor="middle">7</text>
    <text x="460" y="12" text-anchor="middle">9</text>
    <text x="470" y="12">rank</text>
  </g>

  <line x1="280" y1="18" x2="280" y2="135" stroke="#7a828c" stroke-dasharray="3 2"/>
  <text x="285" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">recall@5 cutoff</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5">
    <text x="20" y="33" fill="#7a828c">query 1</text>
    <circle cx="100" cy="30" r="3.5" fill="#bf7d1a"/>
    <text x="320" y="33" fill="#bf7d1a">1/rank = 1.000</text>

    <text x="20" y="63" fill="#7a828c">query 2</text>
    <circle cx="190" cy="60" r="3.5" fill="#bf7d1a"/>
    <text x="320" y="63" fill="#bf7d1a">1/rank = 0.333</text>

    <text x="20" y="93" fill="#7a828c">query 3</text>
    <circle cx="100" cy="90" r="3.5" fill="#bf7d1a"/>
    <text x="320" y="93" fill="#bf7d1a">1/rank = 1.000</text>

    <text x="20" y="123" fill="#7a828c">query 4</text>
    <circle cx="415" cy="120" r="3.5" fill="#7a828c"/>
    <text x="320" y="123" fill="#7a828c">1/rank = 0.125 (miss)</text>
  </g>

  <text x="20" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">recall@5 = 3/4 = 0.75</text>
  <text x="220" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#bf7d1a">MRR = (1.000+0.333+1.000+0.125)/4 &#8776; 0.615</text>
</svg>
