<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" width="480" height="230" role="img" aria-labelledby="title desc">
  <title id="title">Pre-norm keeps the residual path unnormalized end to end; post-norm normalizes the residual sum at every layer</title>
  <desc id="desc">Two side-by-side diagrams of a residual branch. On the left, post-norm: x splits into a bypass line and a line through the sublayer, the two are added together, and that sum is passed through layer norm, so the residual path itself gets normalized at every layer. On the right, pre-norm: x splits into a bypass line and a line that passes through layer norm before the sublayer, the two are added together, and the output is used directly with no further normalization, so the residual path running top to bottom stays completely clean and unobstructed end to end.</desc>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#7a828c">
    <text x="110" y="18" text-anchor="middle">post-norm</text>
    <text x="330" y="18" text-anchor="middle">pre-norm</text>
  </g>

  <text x="110" y="35" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#7a828c">x</text>
  <g stroke="#7a828c" stroke-width="1.5" fill="none">
    <line x1="110" y1="40" x2="70" y2="40"/>
    <line x1="70" y1="40" x2="70" y2="140"/>
    <line x1="110" y1="40" x2="150" y2="40"/>
    <line x1="150" y1="40" x2="150" y2="65"/>
    <rect x="130" y="65" width="40" height="30" rx="3"/>
    <line x1="150" y1="95" x2="150" y2="140"/>
    <line x1="70" y1="140" x2="102" y2="140"/>
    <line x1="150" y1="140" x2="118" y2="140"/>
    <circle cx="110" cy="140" r="9"/>
    <line x1="110" y1="149" x2="110" y2="160"/>
    <rect x="80" y="160" width="60" height="24" rx="3" stroke="#bf7d1a"/>
    <line x1="110" y1="184" x2="110" y2="205"/>
  </g>
  <text x="150" y="83" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">Sublayer</text>
  <text x="110" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">+</text>
  <text x="110" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">LayerNorm</text>
  <text x="110" y="218" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#bf7d1a">residual gets normalized here</text>

  <text x="330" y="35" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#7a828c">x</text>
  <g stroke="#7a828c" stroke-width="1.5" fill="none">
    <line x1="330" y1="40" x2="290" y2="40"/>
    <line x1="330" y1="40" x2="370" y2="40"/>
    <line x1="370" y1="40" x2="370" y2="55"/>
    <rect x="350" y="55" width="40" height="20" rx="3" stroke="#bf7d1a"/>
    <line x1="370" y1="75" x2="370" y2="90"/>
    <rect x="350" y="90" width="40" height="26" rx="3"/>
    <line x1="370" y1="116" x2="370" y2="140"/>
    <line x1="370" y1="140" x2="338" y2="140"/>
    <line x1="290" y1="140" x2="322" y2="140"/>
    <circle cx="330" cy="140" r="9"/>
    <line x1="330" y1="149" x2="330" y2="205"/>
  </g>
  <g stroke="#bf7d1a" stroke-width="2.5" fill="none">
    <line x1="290" y1="40" x2="290" y2="140"/>
  </g>
  <text x="370" y="68" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="6.5" fill="#bf7d1a">LayerNorm</text>
  <text x="370" y="107" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">Sublayer</text>
  <text x="330" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">+</text>
  <text x="290" y="218" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#bf7d1a">residual stays clean, unnormalized</text>
</svg>
