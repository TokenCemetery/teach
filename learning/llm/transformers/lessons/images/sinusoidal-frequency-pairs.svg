<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" role="img" aria-labelledby="title desc">
  <title id="title">Sinusoidal positional encoding oscillates at different frequencies across its dimension pairs</title>
  <desc id="desc">Two waves plotted against position along the horizontal axis. The top wave, from a low-index dimension pair, completes one slow oscillation across the whole range of positions shown. The bottom wave, from a high-index dimension pair, completes eight fast oscillations across the same range. Every position gets a unique combination of values across all these different-frequency waves, which is what gives each position a distinguishable signature.</desc>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#7a828c">
    <text x="60" y="18">low-index dimension pair (small i): slow oscillation</text>
    <text x="60" y="113">high-index dimension pair (large i): fast oscillation</text>
    <text x="250" y="205" text-anchor="middle">position (pos), left to right</text>
  </g>

  <g stroke="#7a828c" stroke-opacity="0.3" stroke-width="1">
    <line x1="60" y1="55" x2="440" y2="55"/>
    <line x1="60" y1="150" x2="440" y2="150"/>
  </g>

  <path d="M60.0,55.0 L73.1,50.3 L86.2,45.8 L99.3,41.7 L112.4,38.2 L125.5,35.6 L138.6,33.8 L151.7,33.0 L164.8,33.3 L177.9,34.6 L191.0,36.8 L204.1,39.9 L217.2,43.7 L230.3,48.0 L243.4,52.6 L256.6,57.4 L269.7,62.0 L282.8,66.3 L295.9,70.1 L309.0,73.2 L322.1,75.4 L335.2,76.7 L348.3,77.0 L361.4,76.2 L374.5,74.4 L387.6,71.8 L400.7,68.3 L413.8,64.2 L426.9,59.7 L440.0,55.0" fill="none" stroke="#7a828c" stroke-width="2"/>

