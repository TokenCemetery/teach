<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210" role="img" aria-labelledby="title desc">
  <title id="title">A singleton holding a scoped dependency captures one instance for the application's lifetime</title>
  <desc id="desc">A singleton OrderCache, created once, holds a reference to the DbContext instance from request 1's scope. Requests 2 and 3 each get their own fresh scope and their own fresh DbContext, but OrderCache never sees either of those: it still points at request 1's instance, which is now effectively a singleton too, for as long as the application runs.</desc>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">
    <rect x="200" y="20" width="160" height="30" rx="3" fill="#7a828c" fill-opacity="0.10" stroke="#7a828c" stroke-opacity="0.5"/>
    <text x="215" y="40" fill="#7a828c">OrderCache (singleton)</text>
  </g>

  <path d="M280,50 L280,85" stroke="#bf7d1a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8">
    <rect x="200" y="88" width="160" height="30" rx="3" fill="#bf7d1a" fill-opacity="0.12" stroke="#bf7d1a"/>
    <text x="215" y="108" fill="#bf7d1a">DbContext (captured)</text>
  </g>

  <path d="M280,88 L280,150" stroke="#bf7d1a" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8">
    <rect x="20" y="153" width="160" height="30" rx="3" fill="#7a828c" fill-opacity="0.10" stroke="#7a828c" stroke-opacity="0.5"/>
    <text x="30" y="173" fill="#7a828c">Request 1 scope</text>

    <rect x="200" y="153" width="160" height="30" rx="3" fill="#7a828c" fill-opacity="0.10" stroke="#7a828c" stroke-opacity="0.5"/>
    <text x="215" y="173" fill="#7a828c">Request 2 scope</text>

    <rect x="380" y="153" width="160" height="30" rx="3" fill="#7a828c" fill-opacity="0.10" stroke="#7a828c" stroke-opacity="0.5"/>
    <text x="395" y="173" fill="#7a828c">Request 3 scope</text>
  </g>

  <text x="20" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">Requests 2 and 3 get their own fresh DbContext too, but OrderCache never sees either one: it still holds request 1's, for the app's whole lifetime</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#bf7d1a"/>
    </marker>
  </defs>
</svg>
