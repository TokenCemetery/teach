<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 182" width="560" height="182" role="img" aria-labelledby="title desc">
  <title id="title">An unbuffered exchange has an instant both sides pass through</title>
  <desc id="desc">Two pairs of timelines. On an unbuffered channel the sender reaches the send and waits until the receiver arrives, and a single marked instant crosses both lanes. On a buffered channel with room the send completes immediately and the receive happens later, so no instant is shared and the sender learns nothing about the receiver.</desc>

  <!-- The vertical crossing both lanes is the whole subject, and its absence
       on the right is the contrast. Accent is the wait and the instant it
       leads to. Tones validated for both surfaces; see .agents/TODO.md. -->

  <path d="M285,26 V160" stroke="#7a828c" stroke-width="1" opacity="0.25" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">
    <text x="20" y="34">unbuffered</text>
    <text x="300" y="34">buffered, with room</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">
    <text x="20" y="73">sender</text>
    <text x="20" y="107">receiver</text>
    <text x="300" y="73">sender</text>
    <text x="300" y="107">receiver</text>
  </g>

  <g stroke="#7a828c" stroke-width="1.5" opacity="0.6" fill="none">
    <path d="M70,70 H262"/>
    <path d="M70,104 H262"/>
    <path d="M350,70 H542"/>
    <path d="M350,104 H542"/>
  </g>

  <path d="M170,60 V114" stroke="#bf7d1a" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <rect x="110" y="66" width="60" height="8" rx="2" fill="#bf7d1a"/>
  <g stroke="#7a828c" stroke-width="1.5" fill="none">
    <path d="M110,64 V76"/>
    <path d="M170,98 V110"/>
    <path d="M390,64 V76"/>
    <path d="M480,98 V110"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">
    <text x="104" y="58">send</text>
    <text x="164" y="126">receive</text>
    <text x="384" y="58">send</text>
    <text x="474" y="126">receive</text>
  </g>
  <text x="176" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">both here</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">
    <text x="20" y="148">each side knows the other reached this point</text>
    <text x="300" y="148">no instant is shared, and the send never waited</text>
  </g>
  <text x="20" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" opacity="0.85">the accented wait is what buys the guarantee; capacity is what spends it</text>
</svg>
