<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 194" width="560" height="194" role="img" aria-labelledby="title desc">
  <title id="title">The same two failures, and only one form keeps both</title>
  <desc id="desc">A body failure and a close failure are thrown in both cases. With try-with-resources both reach the caller, the close failure attached to the other as suppressed. With a hand-written finally block only the close failure reaches the caller, and the body's failure is left as an empty outline where it would have been.</desc>

  <!-- Both panels take the same two failures in. What differs is how many come
       out. Accent marks the one that does not. Tones validated for both
       surfaces; see .agents/TODO.md. -->

  <defs>
    <marker id="g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7a828c"/>
    </marker>
  </defs>

  <path d="M285,34 V162" stroke="#7a828c" stroke-width="1" stroke-opacity="0.25" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">
    <text x="20" y="44">try-with-resources</text>
    <text x="300" y="44">a finally block</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" opacity="0.85">
    <text x="20" y="68">thrown</text>
    <text x="160" y="68">reaches the caller</text>
    <text x="300" y="68">thrown</text>
    <text x="440" y="68">reaches the caller</text>
  </g>

  <g fill="#7a828c" fill-opacity="0.12">
    <rect x="20" y="76" width="110" height="18" rx="2"/>
    <rect x="20" y="104" width="110" height="18" rx="2"/>
    <rect x="160" y="76" width="110" height="18" rx="2"/>
    <rect x="160" y="104" width="110" height="18" rx="2"/>
    <rect x="300" y="76" width="110" height="18" rx="2"/>
    <rect x="300" y="104" width="110" height="18" rx="2"/>
    <rect x="440" y="104" width="110" height="18" rx="2"/>
  </g>
  <rect x="440" y="76" width="110" height="18" rx="2" fill="none" stroke="#bf7d1a" stroke-width="1" stroke-dasharray="3 3"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" text-anchor="middle">
    <text x="75" y="89">query failed</text>
    <text x="75" y="117">close failed</text>
    <text x="215" y="89">query failed</text>
    <text x="215" y="117">close, suppressed</text>
    <text x="355" y="89">query failed</text>
    <text x="355" y="117">close failed</text>
    <text x="495" y="117">close failed</text>
  </g>
  <text x="495" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a" opacity="0.7" text-anchor="middle">query failed</text>

  <g stroke="#7a828c" stroke-width="1.5" stroke-opacity="0.7" fill="none">
    <path d="M130,85 H156" marker-end="url(#g)"/>
    <path d="M130,113 H156" marker-end="url(#g)"/>
    <path d="M410,113 H436" marker-end="url(#g)"/>
  </g>
  <path d="M410,85 H424" stroke="#bf7d1a" stroke-width="1.5" fill="none"/>
  <path d="M428,79 V91" stroke="#bf7d1a" stroke-width="1.5" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">
    <text x="20" y="146">both failures survive</text>
  </g>
  <text x="300" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">the body's failure is replaced outright</text>

  <text x="20" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" opacity="0.85">the same two failures go in, and only one of the two forms lets both out</text>
</svg>
