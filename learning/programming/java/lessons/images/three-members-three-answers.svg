<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 214" width="560" height="214" role="img" aria-labelledby="title desc">
  <title id="title">One recompiled library, three members, three different answers</title>
  <desc id="desc">Three rows for MAX, name and items. The application's class file holds the literal ten for MAX, so nothing crosses to version 2 and the old value is printed. It holds a call to name returning String, which version 2 still provides, so the new value is printed. It holds a call to items returning List, but version 2 provides items returning ArrayList, so the lookup finds no match and the program fails.</desc>

  <!-- Row one has an empty gap on purpose: nothing is looked up, so nothing
       crosses. Accent marks the lookup that finds no match. Tones validated
       for both surfaces; see .agents/TODO.md. -->

  <defs>
    <marker id="g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7a828c"/>
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" opacity="0.85">
    <text x="90" y="48">in App.class</text>
    <text x="310" y="48">in version 2</text>
    <text x="480" y="48">printed</text>
  </g>

  <path d="M286,56 V180" stroke="#7a828c" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">
    <text x="20" y="80">MAX</text>
    <text x="20" y="120">name()</text>
    <text x="20" y="160">items()</text>
  </g>

  <g fill="#7a828c" fill-opacity="0.12">
    <rect x="90" y="65" width="170" height="22" rx="2"/>
    <rect x="90" y="105" width="170" height="22" rx="2"/>
    <rect x="90" y="145" width="170" height="22" rx="2"/>
    <rect x="310" y="65" width="160" height="22" rx="2"/>
    <rect x="310" y="105" width="160" height="22" rx="2"/>
    <rect x="310" y="145" width="160" height="22" rx="2"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">
    <text x="96" y="80">the literal 10</text>
    <text x="96" y="120">a call to name()String</text>
    <text x="96" y="160">a call to items()List</text>
    <text x="316" y="80">MAX = 20, never consulted</text>
    <text x="316" y="120">name()String</text>
    <text x="316" y="160">items()ArrayList</text>
  </g>

  <path d="M264,120 H306" stroke="#7a828c" stroke-width="1.5" stroke-opacity="0.7" fill="none" marker-end="url(#g)"/>
  <path d="M264,160 H296" stroke="#bf7d1a" stroke-width="1.5" fill="none"/>
  <path d="M300,152 V168" stroke="#bf7d1a" stroke-width="1.5" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">
    <text x="480" y="80">10</text>
    <text x="480" y="120">v2</text>
  </g>
  <text x="480" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">NoSuchMethodError</text>

  <text x="20" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" opacity="0.85">the descriptor is part of the name, so items()List and items()ArrayList are different methods</text>
</svg>
