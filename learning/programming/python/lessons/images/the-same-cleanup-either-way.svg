<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 194" width="560" height="194" role="img" aria-labelledby="title desc">
  <title id="title">The same rollback either way, and only one caller hears about it</title>
  <desc id="desc">Two runs of the same failing block. In both, the block raises and __exit__ runs the rollback. Returning None lets the exception reach the caller; returning True suppresses it, so the caller is told the work succeeded even though it was rolled back.</desc>

  <!-- The first two steps are identical in both panels; only the last differs.
       Accent marks the outcome that hides a failure. Tones validated for both
       surfaces; see .agents/TODO.md. -->

  <defs>
    <marker id="g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7a828c"/>
    </marker>
  </defs>

  <path d="M285,32 V166" stroke="#7a828c" stroke-width="1" stroke-opacity="0.25" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">
    <text x="20" y="44">return None</text>
    <text x="300" y="44">return True</text>
  </g>

  <g fill="#7a828c" fill-opacity="0.12">
    <rect x="30" y="60" width="220" height="18" rx="2"/>
    <rect x="30" y="88" width="220" height="18" rx="2"/>
    <rect x="30" y="116" width="220" height="18" rx="2"/>
    <rect x="310" y="60" width="220" height="18" rx="2"/>
    <rect x="310" y="88" width="220" height="18" rx="2"/>
  </g>
  <rect x="310" y="116" width="220" height="18" rx="2" fill="#bf7d1a" fill-opacity="0.9"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" text-anchor="middle">
    <text x="140" y="73">the block raises</text>
    <text x="140" y="101">__exit__ runs ROLLBACK</text>
    <text x="140" y="129">the caller sees the error</text>
    <text x="420" y="73">the block raises</text>
    <text x="420" y="101">__exit__ runs ROLLBACK</text>
  </g>
  <text x="420" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#10141a" text-anchor="middle">the caller sees success</text>

  <g stroke="#7a828c" stroke-width="1.5" stroke-opacity="0.7" fill="none">
    <path d="M140,78 V84" marker-end="url(#g)"/>
    <path d="M140,106 V112" marker-end="url(#g)"/>
    <path d="M420,78 V84" marker-end="url(#g)"/>
    <path d="M420,106 V112" marker-end="url(#g)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c">
    <text x="20" y="154">the rollback happened</text>
  </g>
  <text x="300" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">the rollback happened, and nobody was told</text>

  <text x="20" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" opacity="0.85">one return value decides whether the failure is reported, and the cleanup runs either way</text>
</svg>
