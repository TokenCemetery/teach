<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 234" width="560" height="234" role="img" aria-labelledby="title desc">
  <title id="title">Threads against the same work when it computes and when it waits</title>
  <desc id="desc">Two groups of measured timings. For four CPU-bound units of work, sequential takes 1.01 seconds and four threads take 1.02 seconds, no gain, while four processes take 0.38 and four subinterpreters 0.30. For eight IO-bound waits of 0.2 seconds each, sequential takes 1.66 seconds and eight threads take 0.21, an eight-fold gain. The threads bar is the same tool in both groups and only helps in the second.</desc>

  <!-- Emphasis form: threads carry the accent because they are the entity the
       comparison is about, and everything else recedes. The two accent bars
       are the whole chart, one useless and one decisive. Figures are the
       sheet's own; tones validated for both surfaces, see .agents/TODO.md. -->

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7a828c">
    <rect x="150" y="8" width="10" height="10" rx="2" fill="#bf7d1a"/>
    <text x="166" y="17">threads</text>
    <rect x="250" y="8" width="10" height="10" rx="2" fill="#7a828c"/>
    <text x="266" y="17">everything else</text>
  </g>

  <g stroke="#7a828c" stroke-width="1" opacity="0.2">
    <path d="M252.8,36 V206"/>
    <path d="M355.6,36 V206"/>
    <path d="M458.3,36 V206"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7a828c">
    <text x="20" y="32">four CPU-bound units of work</text>
    <text x="20" y="148">eight IO-bound waits, 0.2s each</text>

    <text x="20" y="51">sequential</text>
    <text x="20" y="73">4 threads</text>
    <text x="20" y="95">4 processes</text>
    <text x="20" y="117">4 subinterpreters</text>
    <text x="20" y="167">sequential</text>
    <text x="20" y="189">8 threads</text>
  </g>

  <!-- 370px of plot spans 0 to 1.8s, so 205.6px per second -->
  <g fill="#7a828c">
    <path d="M150,40 H354.6 A3,3 0 0 1 357.6,43 V51 A3,3 0 0 1 354.6,54 H150 Z"/>
    <path d="M150,84 H225.1 A3,3 0 0 1 228.1,87 V95 A3,3 0 0 1 225.1,98 H150 Z"/>
    <path d="M150,106 H208.7 A3,3 0 0 1 211.7,109 V117 A3,3 0 0 1 208.7,120 H150 Z"/>
    <path d="M150,156 H488.3 A3,3 0 0 1 491.3,159 V167 A3,3 0 0 1 488.3,170 H150 Z"/>
  </g>
  <g fill="#bf7d1a">
    <path d="M150,62 H356.7 A3,3 0 0 1 359.7,65 V73 A3,3 0 0 1 356.7,76 H150 Z"/>
    <path d="M150,178 H190.2 A3,3 0 0 1 193.2,181 V189 A3,3 0 0 1 190.2,192 H150 Z"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7a828c">
    <text x="363.6" y="51">1.01s</text>
    <text x="234.1" y="95">0.38s</text>
    <text x="217.7" y="117">0.30s</text>
    <text x="497.3" y="167">1.66s</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#bf7d1a">
    <text x="365.7" y="73">1.02s</text>
    <text x="405" y="73">no gain</text>
    <text x="199.2" y="189">0.21s</text>
    <text x="238" y="189">eight-fold</text>
  </g>

  <g stroke="#7a828c" stroke-width="1" opacity="0.5" fill="none">
    <path d="M150,206 H520"/>
    <path d="M150,206 V211 M252.8,206 V211 M355.6,206 V211 M458.3,206 V211"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7a828c" text-anchor="middle">
    <text x="150" y="223">0</text>
    <text x="252.8" y="223">0.5</text>
    <text x="355.6" y="223">1.0</text>
    <text x="458.3" y="223">1.5s</text>
  </g>
</svg>
