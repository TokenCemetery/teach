<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" height="190" role="img" aria-labelledby="title desc">
  <title id="title">A parameter allows many implementations; an associated type allows one</title>
  <desc id="desc">If Item were a generic parameter, one type could implement Iterator once per type argument, and a caller would have to say which. As an associated type, the type implements Iterator once and fixes Item inside that implementation, so every caller sees the same answer.</desc>

  <!-- Several impl boxes against one is the claim, so the counts are drawn
       rather than described. Accent marks the binding that settles it. Tones
       validated for both surfaces; see .agents/TODO.md. -->

  <defs>
    <marker id="g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7a828c"/>
    </marker>
  </defs>

  <path d="M285,26 V166" stroke="#7a828c" stroke-width="1" stroke-opacity="0.25" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">
    <text x="20" y="40">if Item were a parameter</text>
    <text x="300" y="40">as an associated type</text>
  </g>

  <g fill="#7a828c" fill-opacity="0.12">
    <rect x="20" y="72" width="90" height="20" rx="2"/>
    <rect x="140" y="58" width="120" height="18" rx="2"/>
    <rect x="140" y="82" width="120" height="18" rx="2"/>
    <rect x="300" y="72" width="90" height="20" rx="2"/>
  </g>
  <rect x="140" y="106" width="120" height="18" rx="2" fill="#7a828c" fill-opacity="0.06"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" text-anchor="middle">
    <text x="65" y="86">Records</text>
    <text x="200" y="71">Iterator&lt;Record&gt;</text>
    <text x="200" y="95">Iterator&lt;String&gt;</text>
    <text x="345" y="86">Records</text>
  </g>
  <text x="200" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" opacity="0.5" text-anchor="middle">and one more per type</text>

  <g fill="none" stroke="#7a828c" stroke-width="1" stroke-opacity="0.5">
    <rect x="420" y="62" width="120" height="52" rx="2"/>
  </g>
  <text x="480" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" text-anchor="middle">impl Iterator</text>
  <rect x="430" y="86" width="100" height="18" rx="2" fill="#7a828c" fill-opacity="0.12" stroke="#bf7d1a" stroke-width="1.5"/>
  <text x="480" y="99" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a" text-anchor="middle">Item = Record</text>

  <g stroke="#7a828c" stroke-width="1.5" stroke-opacity="0.7" fill="none">
    <path d="M110,78 L136,67" marker-end="url(#g)"/>
    <path d="M110,82 L136,91" marker-end="url(#g)"/>
    <path d="M110,86 L136,115" marker-end="url(#g)"/>
    <path d="M390,82 L416,84" marker-end="url(#g)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">
    <text x="20" y="148">a caller must say which</text>
    <text x="300" y="148">every caller sees Item = Record</text>
  </g>

  <text x="20" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" opacity="0.85">one implementation per type, and the choice belongs to whoever wrote it</text>
</svg>
