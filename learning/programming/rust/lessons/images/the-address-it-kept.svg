<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 224" width="560" height="224" role="img" aria-labelledby="title desc">
  <title id="title">Moving a self-referential future leaves its own reference behind</title>
  <desc id="desc">Before the move, a generated future at address 0x1000 holds a value field and a reference field, and the reference points at the value field inside the same struct. After the move, the struct sits at 0x2000 with both fields carried across, the memory at 0x1000 no longer holds the value, and the reference field still names 0x1000, so its arrow now leaves the struct and lands on nothing.</desc>

  <!-- The two arrows are the same arrow: only the struct moved. Accent marks
       the one that no longer lands inside. Tones validated for both surfaces;
       see .agents/TODO.md. -->

  <defs>
    <marker id="g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7a828c"/>
    </marker>
    <marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#bf7d1a"/>
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">
    <text x="20" y="34">before the move</text>
    <text x="20" y="126">after the move</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" opacity="0.85">
    <text x="60" y="46">0x1000</text>
    <text x="60" y="138">0x1000</text>
    <text x="300" y="138">0x2000</text>
  </g>

  <g stroke="#7a828c" stroke-width="1" stroke-opacity="0.5" fill="none">
    <rect x="60" y="50" width="150" height="44" rx="2"/>
    <rect x="300" y="142" width="150" height="44" rx="2"/>
  </g>
  <rect x="60" y="142" width="150" height="44" rx="2" stroke="#7a828c" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3 3" fill="none"/>

  <g fill="#7a828c" fill-opacity="0.12">
    <rect x="64" y="54" width="142" height="16" rx="2"/>
    <rect x="64" y="74" width="142" height="16" rx="2"/>
    <rect x="304" y="146" width="142" height="16" rx="2"/>
    <rect x="304" y="166" width="142" height="16" rx="2"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">
    <text x="70" y="65">value: String</text>
    <text x="70" y="85">reference: &amp;value</text>
    <text x="310" y="157">value: String</text>
    <text x="310" y="177">reference: &amp;value</text>
    <text x="70" y="168">the value is not here</text>
  </g>

  <path d="M64,82 H44 V62 H62" stroke="#7a828c" stroke-width="1.5" stroke-opacity="0.7" fill="none" marker-end="url(#g)"/>
  <text x="226" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">it points inside its own struct</text>

  <path d="M304,174 H240 V164 H212" stroke="#bf7d1a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="222" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#bf7d1a">still 0x1000</text>

  <text x="20" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" opacity="0.85">both fields moved together, and the address stored in one of them did not move with them</text>
</svg>
