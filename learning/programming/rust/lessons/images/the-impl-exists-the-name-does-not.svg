<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 226" width="560" height="226" role="img" aria-labelledby="title desc">
  <title id="title">The implementation exists, and the name that reaches it does not</title>
  <desc id="desc">One module holds the trait, the type and the implementation. The calling module brings the type into scope but not the trait, leaving an empty slot where that import would be, so the method call is refused with E0599.</desc>

  <!-- Everything needed exists on the left; the right is missing one name, drawn
       as the empty slot it would occupy. Accent marks that absence and what it
       costs. Tones validated for both surfaces; see .agents/TODO.md. -->

  <defs>
    <marker id="g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7a828c"/>
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" opacity="0.85">
    <text x="30" y="58">mod shapes</text>
    <text x="310" y="58">mod report</text>
    <text x="322" y="80">in scope here</text>
  </g>

  <g fill="none" stroke="#7a828c" stroke-width="1" stroke-opacity="0.5">
    <rect x="30" y="64" width="220" height="120" rx="2"/>
    <rect x="310" y="64" width="220" height="120" rx="2"/>
  </g>

  <g fill="#7a828c" fill-opacity="0.12">
    <rect x="42" y="76" width="196" height="20" rx="2"/>
    <rect x="42" y="102" width="196" height="20" rx="2"/>
    <rect x="42" y="128" width="196" height="20" rx="2"/>
    <rect x="322" y="86" width="196" height="20" rx="2"/>
    <rect x="322" y="148" width="196" height="20" rx="2"/>
  </g>
  <rect x="322" y="112" width="196" height="20" rx="2" fill="none" stroke="#bf7d1a" stroke-width="1" stroke-dasharray="3 3"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#7a828c" text-anchor="middle">
    <text x="140" y="90">trait Shape</text>
    <text x="140" y="116">struct Square</text>
    <text x="140" y="142">impl Shape for Square</text>
    <text x="420" y="100">use shapes::Square</text>
    <text x="420" y="162">sq.area()</text>
  </g>
  <text x="420" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a" text-anchor="middle">no use of Shape</text>

  <g stroke="#7a828c" stroke-width="1.5" stroke-opacity="0.7" fill="none">
    <path d="M420,132 V144" marker-end="url(#g)"/>
    <path d="M420,168 V192" marker-end="url(#g)"/>
  </g>

  <text x="310" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7" fill="#bf7d1a">E0599: no method named area</text>

  <text x="20" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" opacity="0.85">the implementation exists, and the name that reaches it does not</text>
</svg>
