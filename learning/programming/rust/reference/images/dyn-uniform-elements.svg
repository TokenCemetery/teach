<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 216" width="560" height="216" role="img" aria-labelledby="title desc">
  <title id="title">Why a trait object can hold more than one concrete type</title>
  <desc id="desc">On the left, a Vec of a generic type parameter: every element is the same concrete type, a Square, and adding a Circle is a type error. On the right, a Vec of boxed trait objects: every element is a pair of pointers, one to the data and one to the vtable, all the same size, and the values they point at are a Square, a Circle and a Square of different sizes.</desc>

  <!-- The claim is about element size, so the elements are drawn the same
       width on the right while the things behind them are not. Accent marks
       the rejection on the left. Tones validated for both surfaces; see
       .agents/TODO.md. -->

  <path d="M285,26 V196" stroke="#7a828c" stroke-width="1" opacity="0.25" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7a828c">
    <text x="20" y="34">Vec&lt;T&gt;, one T chosen at the call site</text>
    <text x="300" y="34">Vec&lt;Box&lt;dyn Area&gt;&gt;</text>
  </g>

  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a828c"/>
    </marker>
  </defs>

  <g fill="none" stroke="#7a828c" stroke-width="1.5">
    <rect x="30" y="56" width="60" height="24" rx="3"/>
    <rect x="96" y="56" width="60" height="24" rx="3"/>
    <rect x="162" y="56" width="60" height="24" rx="3"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c" text-anchor="middle">
    <text x="60" y="72">Square</text>
    <text x="126" y="72">Square</text>
    <text x="192" y="72">Square</text>
  </g>
  <text x="20" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">the element type is the concrete type</text>
  <text x="20" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#bf7d1a">a Circle in this Vec is E0308</text>

  <!-- each element is two pointers, and every element is the same width -->
  <g fill="none" stroke="#7a828c" stroke-width="1.5">
    <rect x="310" y="56" width="68" height="24" rx="3"/>
    <rect x="384" y="56" width="68" height="24" rx="3"/>
    <rect x="458" y="56" width="68" height="24" rx="3"/>
    <path d="M344,56 V80 M418,56 V80 M492,56 V80"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" text-anchor="middle">
    <text x="327" y="71">data</text><text x="361" y="71">vtable</text>
    <text x="401" y="71">data</text><text x="435" y="71">vtable</text>
    <text x="475" y="71">data</text><text x="509" y="71">vtable</text>
  </g>

  <g fill="none" stroke="#7a828c" stroke-width="1.5" marker-end="url(#p)">
    <path d="M327,80 L328,126"/>
    <path d="M401,80 L408,126"/>
    <path d="M475,80 L480,126"/>
  </g>

  <g fill="none" stroke="#7a828c" stroke-width="1.5">
    <rect x="300" y="128" width="56" height="24" rx="3"/>
    <rect x="372" y="128" width="72" height="24" rx="3"/>
    <rect x="452" y="128" width="56" height="24" rx="3"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c" text-anchor="middle">
    <text x="328" y="144">Square</text>
    <text x="408" y="144">Circle</text>
    <text x="480" y="144">Square</text>
  </g>

  <text x="300" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">one width per element, several types behind</text>

  <text x="20" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">the deciding question is heterogeneity: whether one width has to hold several types</text>
</svg>
