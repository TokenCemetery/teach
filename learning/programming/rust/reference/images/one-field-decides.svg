<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 194" width="560" height="194" role="img" aria-labelledby="title desc">
  <title id="title">One invariant field makes the whole struct invariant</title>
  <desc id="desc">The same struct before and after. Before, it holds two borrowed fields, both covariant, and the struct is covariant. After, one private field holding a Cell is added, which is invariant, and the struct is invariant overall. No public signature changed between the two.</desc>

  <!-- The table's last row says one field decides the whole type. Drawing the
       two structs side by side is what makes the added field's privacy the
       point: nothing a caller can see is different. Accent marks the field
       that decides and the verdict it forces. Tones validated for both
       surfaces; see .agents/TODO.md. -->

  <path d="M285,26 V164" stroke="#7a828c" stroke-width="1" opacity="0.25" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">
    <text x="20" y="34">before</text>
    <text x="300" y="34">after adding one private field</text>
  </g>

  <g fill="none" stroke="#7a828c" stroke-width="1.5">
    <rect x="20" y="44" width="250" height="68" rx="3"/>
    <rect x="300" y="44" width="250" height="86" rx="3"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">
    <text x="30" y="62">struct S&lt;'a&gt;</text>
    <text x="310" y="62">struct S&lt;'a&gt;</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c">
    <text x="30" y="82">a: &amp;'a str</text>
    <text x="30" y="100">b: &amp;'a [u8]</text>
    <text x="310" y="82">a: &amp;'a str</text>
    <text x="310" y="100">b: &amp;'a [u8]</text>
  </g>
  <text x="310" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#bf7d1a">cache: Cell&lt;&amp;'a str&gt;</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#7a828c" text-anchor="end" opacity="0.9">
    <text x="260" y="82">covariant</text>
    <text x="260" y="100">covariant</text>
    <text x="540" y="82">covariant</text>
    <text x="540" y="100">covariant</text>
  </g>
  <text x="540" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#bf7d1a" text-anchor="end">invariant</text>

  <text x="20" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">S&lt;'a&gt; is covariant</text>
  <text x="300" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#bf7d1a">S&lt;'a&gt; is invariant</text>

  <text x="20" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">no public signature changed, and a caller stops compiling far from the cause</text>
</svg>
