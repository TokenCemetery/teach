<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 212" width="560" height="212" role="img" aria-labelledby="title desc">
  <title id="title">Why only the leading column of an index can start a walk</title>
  <desc id="desc">The same index on a and b, shown twice in its stored order. Filtering on a, the leading column, selects entries that sit next to each other in one unbroken run. Filtering on b alone selects entries scattered through the index with non-matching entries between them, so there is no run to walk and the whole index would have to be read.</desc>

  <!-- The rule is about storage order, so the picture is the storage order.
       Accent marks the entries a filter selects; whether they touch is the
       entire difference between the two panels. Tones validated for both
       surfaces; see .agents/TODO.md. -->

  <text x="280" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7a828c" text-anchor="middle">an index on (a, b), in its stored order</text>

  <path d="M285,36 V196" stroke="#7a828c" stroke-width="1" opacity="0.25" fill="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#7a828c">
    <text x="20" y="48">filter on a, the leading column</text>
    <text x="300" y="48">filter on b alone</text>
  </g>

  <!-- a = 2 selects one unbroken run -->
  <g fill="#bf7d1a">
    <rect x="28" y="104" width="3" height="16"/>
    <rect x="28" y="120" width="3" height="16"/>
  </g>
  <!-- b = y selects three entries with others between them -->
  <g fill="#bf7d1a">
    <rect x="308" y="72" width="3" height="16"/>
    <rect x="308" y="120" width="3" height="16"/>
    <rect x="308" y="152" width="3" height="16"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7a828c">
    <text x="40" y="68">(1, x)</text>
    <text x="40" y="84">(1, y)</text>
    <text x="40" y="100">(1, z)</text>
    <text x="40" y="148">(3, x)</text>
    <text x="40" y="164">(3, y)</text>
    <text x="40" y="180">(3, z)</text>

    <text x="320" y="68">(1, x)</text>
    <text x="320" y="100">(1, z)</text>
    <text x="320" y="116">(2, x)</text>
    <text x="320" y="148">(3, x)</text>
    <text x="320" y="180">(3, z)</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#bf7d1a">
    <text x="40" y="116">(2, x)</text>
    <text x="40" y="132">(2, y)</text>

    <text x="320" y="84">(1, y)</text>
    <text x="320" y="132">(2, y)</text>
    <text x="320" y="164">(3, y)</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#7a828c">
    <text x="20" y="204">one unbroken run: find the start, then walk</text>
    <text x="300" y="204">three runs of one: nothing to walk along</text>
  </g>
</svg>
