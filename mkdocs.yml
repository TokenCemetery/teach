site_name: teach
site_description: "Educational materials: lessons and reference guides for self-study"
# Without this, sitemap.xml has "None" locs and no page gets a canonical link.
site_url: https://tokencemetery.github.io/teach/
repo_url: https://github.com/TokenCemetery/teach
# MkDocs would guess `edit/master/docs/`, which 404s here.
edit_uri: edit/main/learning/
copyright: Copyright &copy; 2026 Token Cemetery
docs_dir: learning
site_dir: site

theme:
  name: primer
  social:
    - service: github
      link: https://github.com/TokenCemetery/teach

# Patches for mkdocs-section-index and front-matter checks; see hooks.py.
hooks:
  - hooks.py

markdown_extensions:
  # Renders markdown inside the `<details markdown="1">` answer keys.
  - md_in_html
  # Keeps list numbering across an interrupting `<details>` block.
  - sane_lists
  # Match GitHub, where single newlines are line breaks. Safe because no prose
  # in `learning/` is hard-wrapped.
  - nl2br
  - pymdownx.highlight
  # Without the custom fence, ```mermaid blocks render as highlighted source.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  # Empty permalink text: the theme draws the anchor icon itself.
  - toc:
      permalink: ""
      permalink_class: anchor
      permalink_leading: true

plugins:
  - search:
      # No `lang`: MkDocs lacks wordcut.js, which its Hindi Lunr adapter needs.
  # Must run before section-index, which rewrites its nav.
  - awesome-nav
  - i18n:
      docs_structure: suffix
      reconfigure_search: false
      # `theme.locale` must be set per language for a third-party theme.
      # `en` is last so 404.html and search.html, rewritten by every language
      # pass, end up in English.
      languages:
        - locale: es
          name: Spanish
          build: true
          theme:
            locale: es
        - locale: zh
          name: Chinese
          build: true
          theme:
            locale: zh
        - locale: hi
          name: Hindi
          build: true
          theme:
            locale: hi
        - locale: pt
          name: Portuguese
          build: true
          theme:
            locale: pt
        - locale: ru
          name: Russian
          build: true
          theme:
            locale: ru
        - locale: fr
          name: French
          build: true
          theme:
            locale: fr
        - locale: en
          default: true
          name: English
          build: true
          theme:
            locale: en
  # Makes each section label link to its README.md overview.
  - section-index
  # Feeds the theme footer's "Last updated".
  - git-revision-date-localized:
      # A shallow clone has no log for a page.
      fallback_to_build_date: true
      enable_creation_date: true
  # After i18n: it injects its loader in `on_post_page`, and i18n rebuilds
  # each page per language. Pinned because mermaid's default layout changes
  # between releases.
  - mermaid2:
      version: 10.4.0

exclude_docs: |
  **/NOTES.md
  **/learning-records/
