site_name: teach
site_description: "Учебные материалы: уроки и справочники для самостоятельного изучения"
repo_url: https://github.com/TokenCemetery/teach
docs_dir: learning
site_dir: site

theme:
  name: shadcn

extra_css:
  - extra.css

markdown_extensions:
  # Lessons collapse their answer keys into `<details markdown="1">`. Without
  # this, Python-Markdown passes the block through raw and the answer renders
  # as literal markdown: backticks, bold and all.
  - md_in_html
  # A `<details>` block interrupts the surrounding ordered list, so every
  # Practice item restarted at "1.". This carries the number across the break.
  - sane_lists
  # GitHub renders a single newline as a line break; Python-Markdown folds it
  # into the paragraph. That collapsed every lesson's header block, every
  # glossary definition and the worked calculations in answer keys. Match
  # GitHub, since the same files are read in both places. Safe here because no
  # prose in `learning/` is hard-wrapped, checked before enabling.
  - nl2br
  # The theme ships Pygments stylesheets but nothing was emitting Pygments
  # markup, so every code block rendered unhighlighted.
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - awesome-nav
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Spanish
          build: true
        - locale: zh
          name: Chinese
          build: true
        - locale: hi
          name: Hindi
          build: true
        - locale: pt
          name: Portuguese
          build: true
        - locale: ru
          name: Russian
          build: true
        - locale: fr
          name: French
          build: true

exclude_docs: |
  **/NOTES.md
  **/learning-records/
