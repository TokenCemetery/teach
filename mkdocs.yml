site_name: teach
site_description: Учебные материалы — уроки и справочники для самостоятельного изучения
repo_url: https://github.com/TokenCemetery/teach
docs_dir: learning
site_dir: site

theme:
  name: shadcn

extra_css:
  - extra.css

plugins:
  - search
  - awesome-nav
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Spanish
          build: true
        - locale: zh
          name: Chinese
          build: true
        - locale: hi
          name: Hindi
          build: true
        - locale: pt
          name: Portuguese
          build: true
        - locale: ru
          name: Russian
          build: true
        - locale: fr
          name: French
          build: true

exclude_docs: |
  **/NOTES.md
  **/RESOURCES.md
  **/learning-records/
