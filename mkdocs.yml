site_name: teach
site_description: Учебные материалы — уроки и справочники для самостоятельного изучения
repo_url: https://github.com/TokenCemetery/teach
docs_dir: learning
site_dir: site

theme:
  name: shadcn

plugins:
  - search
  - awesome-nav
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Russian
          build: true

exclude_docs: |
  **/NOTES.md
  **/RESOURCES.md
  **/learning-records/
