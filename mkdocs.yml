site_name: teach
site_description: "Учебные материалы: уроки и справочники для самостоятельного изучения"
# Without this, every `<loc>` in sitemap.xml is written as "None" and no page
# gets a canonical link, so the seven locales compete as duplicates of each
# other. The theme emits no per-page hreflang tags either way; the sitemap
# carries the alternates.
site_url: https://tokencemetery.github.io/teach/
repo_url: https://github.com/TokenCemetery/teach
# The theme footer links each page back to its source. MkDocs guesses
# `edit/master/docs/` for a GitHub repository, and this one has neither that
# branch nor that directory, so every link would 404.
edit_uri: edit/main/learning/
docs_dir: learning
site_dir: site

theme:
  name: primer

# Drops one false-positive warning from mkdocs-section-index so `--strict`
# stays usable. See the docstring in hooks.py.
hooks:
  - hooks.py

markdown_extensions:
  # Lessons collapse their answer keys into `<details markdown="1">`. Without
  # this, Python-Markdown passes the block through raw and the answer renders
  # as literal markdown: backticks, bold and all.
  - md_in_html
  # A `<details>` block interrupts the surrounding ordered list, so every
  # Practice item restarted at "1.". This carries the number across the break.
  - sane_lists
  # GitHub renders a single newline as a line break; Python-Markdown folds it
  # into the paragraph. That collapsed every lesson's header block, every
  # glossary definition and the worked calculations in answer keys. Match
  # GitHub, since the same files are read in both places. Safe here because no
  # prose in `learning/` is hard-wrapped, checked before enabling.
  - nl2br
  # The theme ships Pygments stylesheets but nothing was emitting Pygments
  # markup, so every code block rendered unhighlighted.
  - pymdownx.highlight
  - pymdownx.superfences
  # GitHub puts a hover anchor beside every heading, and the same files are
  # read there. The theme draws the octicon itself, so the permalink text
  # stays empty and no stray glyph reaches the search index.
  - toc:
      permalink: ""
      permalink_class: anchor
      permalink_leading: true

plugins:
  - search
  # Nav comes from learning/.nav.yml. Must run before section-index, which
  # rewrites the nav it produces.
  - awesome-nav
  - i18n:
      docs_structure: suffix
      # `theme.locale` per language is what switches the theme's own chrome
      # (Search, Back to top, Previous/Next) to that language. The plugin sets
      # it automatically only for the themes MkDocs itself ships, so a
      # third-party theme needs it spelled out.
      #
      # `en` is listed last on purpose. One build pass runs per language, and
      # the two pages that exist once for the whole site, 404.html and
      # search.html, are rewritten by every pass, so the last language wins
      # them. Putting the default language last leaves those two in English.
      # The theme sorts the language selector itself, so this does not affect
      # its order.
      languages:
        - locale: es
          name: Spanish
          build: true
          theme:
            locale: es
        - locale: zh
          name: Chinese
          build: true
          theme:
            locale: zh
        - locale: hi
          name: Hindi
          build: true
          theme:
            locale: hi
        - locale: pt
          name: Portuguese
          build: true
          theme:
            locale: pt
        - locale: ru
          name: Russian
          build: true
          theme:
            locale: ru
        - locale: fr
          name: French
          build: true
          theme:
            locale: fr
        - locale: en
          default: true
          name: English
          build: true
          theme:
            locale: en
  # Every workspace's overview lives in its README.md. Without this the
  # section label and the overview are two separate nav rows; with it the
  # label itself links to the overview.
  - section-index
  # Sets page.meta.git_revision_date_localized, which the theme footer prints
  # as "Last updated". Nothing in `learning/` carries a hand-written date.
  - git-revision-date-localized:
      # A shallow clone has no log for a page; fall back rather than fail.
      fallback_to_build_date: true

exclude_docs: |
  **/NOTES.md
  **/learning-records/
