site_name: teach
site_description: "Educational materials: lessons and reference guides for self-study"
# Without this, sitemap.xml has "None" locs and no page gets a canonical link.
site_url: https://tokencemetery.github.io/teach/
repo_url: https://github.com/TokenCemetery/teach
# ProperDocs would guess `edit/master/docs/`, which 404s here.
edit_uri: edit/main/learning/
copyright: Copyright &copy; 2026 Token Cemetery
docs_dir: learning
site_dir: site

theme:
  name: primer
  custom_dir: overrides
  # Renders only the open topic's pages, not every topic's. With all of them
  # the nav was most of each page's HTML and of the build time (#205).
  nav_expand: active
  social:
    - service: github
      link: https://github.com/TokenCemetery/teach

# Patches for mkdocs-section-index and front-matter checks; see hooks.py.
hooks:
  - hooks.py

markdown_extensions:
  # Renders markdown inside the `<details markdown="1">` answer keys.
  - md_in_html
  # Keeps list numbering across an interrupting `<details>` block.
  - sane_lists
  # Match GitHub, where single newlines are line breaks. Safe because no prose
  # in `learning/` is hard-wrapped.
  - nl2br
  - pymdownx.highlight
  # Without the custom fence, ```mermaid blocks render as highlighted source.
  # `fence_div_format` HTML-escapes the source, and Mermaid entity-decodes the
  # div's innerHTML, so the browser reads the diagram exactly as written.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  # Empty permalink text: the theme draws the anchor icon itself.
  - toc:
      permalink: ""
      permalink_class: anchor
      permalink_leading: true

plugins:
  - search:
      # No `lang`: ProperDocs lacks wordcut.js, which its Hindi Lunr adapter needs.
  # Must run before section-index, which rewrites its nav.
  - awesome-nav
  - i18n:
      docs_structure: suffix
      reconfigure_search: false
      # `theme.locale` must be set per language for a third-party theme.
      # `nav_translations` localizes the domain labels from `learning/.nav.yml`,
      # which no page title can supply.
      # `en` is last so 404.html and search.html, rewritten by every language
      # pass, end up in English.
      languages:
        - locale: es
          name: Spanish
          build: true
          theme:
            locale: es
          nav_translations:
            Data: Datos
            Architecture: Arquitectura
            Infrastructure: Infraestructura
            Programming: Programación
        - locale: zh
          name: Chinese
          build: true
          theme:
            locale: zh
          nav_translations:
            Data: 数据
            Architecture: 架构
            Infrastructure: 基础设施
            Programming: 编程
        - locale: hi
          name: Hindi
          build: true
          theme:
            locale: hi
          nav_translations:
            Data: डेटा
            Architecture: आर्किटेक्चर
            Infrastructure: इन्फ्रास्ट्रक्चर
            Programming: प्रोग्रामिंग
        - locale: pt
          name: Portuguese
          build: true
          theme:
            locale: pt
          nav_translations:
            Data: Dados
            Architecture: Arquitetura
            Infrastructure: Infraestrutura
            Programming: Programação
        - locale: ru
          name: Russian
          build: true
          theme:
            locale: ru
          nav_translations:
            Data: Данные
            Architecture: Архитектура
            Infrastructure: Инфраструктура
            Programming: Программирование
        - locale: fr
          name: French
          build: true
          theme:
            locale: fr
          nav_translations:
            Data: Données
            Architecture: Architecture
            Infrastructure: Infrastructure
            Programming: Programmation
        - locale: en
          default: true
          name: English
          build: true
          theme:
            locale: en
  # Makes each section label link to its README.md overview.
  - section-index
  # Feeds the theme footer's "Last updated".
  - git-revision-date-localized:
      # A shallow clone has no log for a page.
      fallback_to_build_date: true
      enable_creation_date: true

# Read by overrides/main.html, which loads Mermaid on pages with a diagram.
# The mermaid2 plugin did that by re-parsing every such page, which was half
# the build. Pinned because mermaid's default layout changes between releases.
extra:
  mermaid_version: 10.4.0

exclude_docs: |
  **/NOTES.md
  **/learning-records/
