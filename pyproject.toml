[project]
name = "teach"
version = "0.0.0"
description = "Build dependencies for the published learning site."
requires-python = ">=3.9"
dependencies = [
    "properdocs",
    # The theme is pinned: its layout, sidebar width and navigation change
    # between releases, and this site is checked against one of them.
    "mkdocs-primer==0.4.1",
    "mkdocs-static-i18n",
    "mkdocs-awesome-nav",
    "mkdocs-section-index",
    "mkdocs-git-revision-date-localized-plugin",
    # Only for `mermaid2.fence_mermaid`; the plugin itself is not enabled.
    "mkdocs-mermaid2-plugin",
    "pymdown-extensions",
    "Pygments",
]

[tool.setuptools]
py-modules = []
